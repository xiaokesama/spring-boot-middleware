spring.application.name=springboot-cache
server.port=8086

# Caffeine 规格：初始容量 / 最大条数 / 写入后过期 / 统计开关
cache.caffeine.initial-capacity=100
cache.caffeine.maximum-size=1000
cache.caffeine.expire-after-write-seconds=60
cache.caffeine.record-stats=true

# 本地缓存未命中时回源的模拟耗时（毫秒），用于观察「缓存击穿」
cache.slow-query-millis=300
