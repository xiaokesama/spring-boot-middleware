spring.application.name=springboot-clickhouse
server.port=8090

# ClickHouse 走 HTTP 端口 8123（原生 TCP 是 9000，但 9000 已被 MinIO 占用，别混）
# 1) 用 127.0.0.1 而不是 localhost：ClickHouse 默认只监听 IPv4
# 2) compress=0：驱动默认用 LZ4 压缩，但 classpath 没带 LZ4 本地库，
#    会报 "LZ4 is not supported"，换成 gzip 或直接关闭压缩最省事
spring.datasource.url=jdbc:clickhouse://127.0.0.1:8123/default?compress=0
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver
spring.datasource.username=default
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
# ClickHouse 的连接校验语句与 MySQL 不同
spring.datasource.hikari.connection-test-query=SELECT 1

clickhouse.database=lab
clickhouse.table=user_events
