spring.application.name=springboot-kafka
server.port=8089

spring.kafka.bootstrap-servers=localhost:9092

# ---------- 生产者 ----------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# 注意：这里不配置 transaction-id-prefix。
# 一旦给主模板配了它，所有 send 都必须处于事务中，普通发送会抛
# "No transaction is in process"。事务能力单独用一个模板演示（见 ProducerService）。

# ---------- 消费者 ----------
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=lab-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
# 关闭自动提交，改由监听器方法成功后提交，才能演示「至少一次」语义
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.max.poll.records=10
# 只有 read_committed 才看不到被回滚的事务消息
spring.kafka.consumer.properties.isolation.level=read_committed

# ---------- 监听容器 ----------
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=3
spring.kafka.listener.missing-topics-fatal=false

# 本模块自己声明的 topic 名，避免到处写字符串
kafka.topic.demo=demo-topic
kafka.topic.dlt=demo-topic.DLT
