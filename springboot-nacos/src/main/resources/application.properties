spring.application.name=springboot-nacos

# nacos-config-spring-boot-starter 读取的键（注意是 config 不是 congfig）
nacos.config.server-addr=127.0.0.1:8848

# TestConfig 用 @ConfigurationProperties(prefix = "nacos") 绑定 serverAddr，
# 对应的是 nacos.server-addr —— 两个键都要有，否则注入为 null
nacos.server-addr=127.0.0.1:8848

# 命名空间与分组（可选）
nacos.config.namespace=
nacos.config.group=DEFAULT_GROUP
