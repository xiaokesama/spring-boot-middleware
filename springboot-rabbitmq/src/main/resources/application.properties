spring.application.name=springboot-rabbitmq
server.port=8091

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# 发布确认：correlated 模式可以用 CorrelationData 拿到 ack/nack 结果
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# 手动 ack：由监听器显式 basicAck / basicNack，才能演示「消息不丢」
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
# 重试用尽后不要丢弃，抛出去交给死信队列
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# 交换机 / 队列 / 路由键命名集中在这里
rabbitmq.exchange.direct=lab.direct
rabbitmq.exchange.topic=lab.topic
rabbitmq.exchange.fanout=lab.fanout
rabbitmq.exchange.headers=lab.headers
rabbitmq.queue.demo=lab.queue.demo
rabbitmq.queue.dlq=lab.queue.dlq
