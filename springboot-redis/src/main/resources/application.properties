spring.application.name=springboot-redis
server.port=8080

# Boot 3 的标准配置项（Boot 2 时代是 spring.redis.*）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# classpath 上同时有 Lettuce 和 Jedis 时，必须显式指定，否则默认 Lettuce
spring.data.redis.client-type=jedis

# 连接池（使用 Jedis 时生效）
spring.data.redis.jedis.pool.max-active=16
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=2
